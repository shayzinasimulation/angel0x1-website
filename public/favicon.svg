<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Minimal winged-eye favicon: transparent (no box), the red iris is the mark.
       It blinks on a slow cycle where the browser animates SVG favicons (e.g. Firefox);
       elsewhere it rests as a clean open eye. -->
  <!-- crown rays -->
  <g stroke="#B33A2B" stroke-width="2.4" stroke-linecap="round" opacity="0.55">
    <path d="M27,17 L25,9"/>
    <path d="M32,16 L32,7"/>
    <path d="M37,17 L39,9"/>
  </g>
  <!-- eye almond (blinks via d) -->
  <path fill="#B33A2B">
    <animate attributeName="d" dur="4.8s" repeatCount="indefinite"
      keyTimes="0;0.9;0.95;1"
      values="M10,34 Q32,18 54,34 Q32,50 10,34 Z;
              M10,34 Q32,18 54,34 Q32,50 10,34 Z;
              M10,34 Q32,33 54,34 Q32,35 10,34 Z;
              M10,34 Q32,18 54,34 Q32,50 10,34 Z"/>
  </path>
  <!-- pupil (fades as the lid closes) -->
  <circle cx="32" cy="34" r="6" fill="#FCFBF9">
    <animate attributeName="opacity" dur="4.8s" repeatCount="indefinite"
      keyTimes="0;0.9;0.95;1" values="1;1;0;1"/>
  </circle>
</svg>
